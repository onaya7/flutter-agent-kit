name: kit_template_app
description: A Flutter app built on clean architecture, bloc and three flavors.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.0
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  delightful_toast: ^1.1.0
  device_preview: ^1.2.0
  dio: ^5.11.0
  dio_request_inspector: ^3.2.1
  dio_smart_retry: ^7.0.1
  equatable: ^2.0.7
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.16
  freezed_annotation: ^3.0.0
  gap: ^3.0.1
  get_it: ^8.0.3
  go_router: ^16.1.0
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.1
  iconsax_plus: ^1.0.0
  image_picker: ^1.1.2
  injectable: ^2.5.0
  internet_connection_checker_plus: ^2.7.2
  intl: ^0.20.2
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.2
  share_plus: ^11.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  bloc_lint: ^0.3.6
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.22
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  hive_ce_generator: ^1.9.0
  injectable_generator: ^2.6.2
  json_serializable: ^6.9.0
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.6
  very_good_analysis: ^10.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.development
    - .env.staging
    - .env.production
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_gen:
  integrations:
    flutter_svg: true
  assets:
    exclude:
      - .env.development
      - .env.staging
      - .env.production
